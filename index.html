<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowing Our Heroes - AI Classifier</title>
    <style>
        :root {
            --primary-glow: #00d2ff;
            --secondary-glow: #3a7bd5;
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.75);
            --text-color: #f3f4f6;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 10%, #1e293b 0%, var(--bg-color) 90%);
            color: var(--text-color);
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .hero-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        .action-btn {
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 114, 255, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 25px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 114, 255, 0.6);
        }

        .camera-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: inline-block;
            margin-bottom: 25px;
        }

        #webcam-container canvas {
            border-radius: 12px;
            display: block;
        }

        #label-container {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: left;
        }

        .prediction-row {
            margin-bottom: 16px;
        }

        .prediction-row:last-child {
            margin-bottom: 0;
        }

        .prediction-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 600;
            color: #e5e7eb;
            margin-bottom: 6px;
        }

        .bar-background {
            background-color: rgba(255, 255, 255, 0.05);
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .bar-fill {
            background: linear-gradient(90deg, #3a7bd5, #00d2ff);
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.08s ease-out;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="hero-title">Knowing Our Heroes</h1>
        <p class="hero-subtitle">Real-time AI character recognition interface</p>

        <button type="button" class="action-btn" onclick="init()">Initialize Scanner</button>

        <div>
            <div class="camera-card">
                <div id="webcam-container"></div>
            </div>
        </div>

        <div id="label-container">
            <p style="text-align: center; color: #6b7280; margin: 0;">Scanner offline. Click initialize to begin tracking...</p>
        </div>
    </div>

    <!-- TensorFlow.js and Teachable Machine Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/rj713fnJG/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const flip = true; 
            webcam = new tmImage.Webcam(320, 320, flip);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            const webcamContainer = document.getElementById("webcam-container");
            webcamContainer.innerHTML = "";
            webcamContainer.appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = ""; 

            for (let i = 0; i < maxPredictions; i++) {
                const classTitle = model.getClassLabels()[i];
                
                const row = document.createElement("div");
                row.className = "prediction-row";
                row.innerHTML = `
                    <div class="prediction-header">
                        <span>${classTitle}</span>
                        <span id="percent-${i}">0%</span>
                    </div>
                    <div class="bar-background">
                        <div id="bar-${i}" class="bar-fill"></div>
                    </div>
                `;
                labelContainer.appendChild(row);
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            for (let i = 0; i < maxPredictions; i++) {
                const percentValue = (prediction[i].probability * 100).toFixed(0);
                
                const percentEl = document.getElementById(`percent-${i}`);
                const barEl = document.getElementById(`bar-${i}`);
                
                if (percentEl && barEl) {
                    percentEl.innerText = percentValue + "%";
                    barEl.style.width = percentValue + "%";
                }
            }
        }
    </script>
</body>
</html>
